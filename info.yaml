project:
  title:        "SPI-Controlled PWM ASIC"
  author:       "Ethan Tiong"
  discord:      "tofu.xx"
  description:  "Write-only SPI Mode 0 control for 16 static/PWM outputs with a shared 8-bit duty cycle"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  "tt_um_uwasic_onboarding_ethan_tiong"

  source_files:
    - "project.v"
    - "spi_peripheral.v"
    - "pwm_peripheral.v"
    - "sync_2ff.v"
    - "posedge_detector.v"

pinout:
  ui[0]: "SCLK"
  ui[1]: "COPI"
  ui[2]: "nCS"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "PWM0"
  uo[1]: "PWM1"
  uo[2]: "PWM2"
  uo[3]: "PWM3"
  uo[4]: "PWM4"
  uo[5]: "PWM5"
  uo[6]: "PWM6"
  uo[7]: "PWM7"

  uio[0]: "PWM8"
  uio[1]: "PWM9"
  uio[2]: "PWM10"
  uio[3]: "PWM11"
  uio[4]: "PWM12"
  uio[5]: "PWM13"
  uio[6]: "PWM14"
  uio[7]: "PWM15"

yaml_version: 6
