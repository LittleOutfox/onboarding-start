# Tiny Tapeout project information
project:
  title:        "SPI-Controlled PWM Peripheral"      # Project title
  author:       "Ethan Tiong"      # Your name
  discord:      "tofu.xx"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "16 output channels driven over an SPI peripheral interface, each independently switchable between static level and PWM"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_uwasic_onboarding_ethan_tiong"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "spi_peripheral.v"
    - "pwm_peripheral.v"
    - "sync_2ff.v"
    - "sync_sclk_posedge.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SCLK"
  ui[1]: "COPI"
  ui[2]: "nCS"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PWM0"
  uo[1]: "PWM1"
  uo[2]: "PWM2"
  uo[3]: "PWM3"
  uo[4]: "PWM4"
  uo[5]: "PWM5"
  uo[6]: "PWM6"
  uo[7]: "PWM7"

  # Bidirectional pins
  uio[0]: "PWM8"
  uio[1]: "PWM9"
  uio[2]: "PWM10"
  uio[3]: "PWM11"
  uio[4]: "PWM12"
  uio[5]: "PWM13"
  uio[6]: "PWM14"
  uio[7]: "PWM15"

# Do not change!
yaml_version: 6
